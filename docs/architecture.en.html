<style>
  /* Layout: dark slide-style network background, one centered architecture diagram */
  :root {
    --bg: #04070d;
    --ink: #f4f7fb;
    --muted: #a9b5c7;
    --arrow: #d5dbe4;
    --font: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    color-scheme: dark;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .frame { max-width: 1366px; margin: 0 auto; overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 900px; height: auto; font-family: var(--font); }
  .t1 { font-size: 34px; font-weight: 900; fill: var(--ink); }
  .lbl { font-size: 19px; font-weight: 700; fill: var(--ink); }
  .big { font-size: 26px; font-weight: 700; fill: var(--ink); }
  .sub { font-size: 16px; font-weight: 500; fill: var(--muted); }
  .arr { stroke: var(--arrow); stroke-width: 5; fill: none; }
</style>

<script>
  // Background network, fixed seed so every render matches
  (function () {
    var g = document.getElementById("net"), ns = "http://www.w3.org/2000/svg";
    var s = 7, rnd = function () { s = (s * 16807) % 2147483647; return s / 2147483647; };
    var pts = [];
    for (var i = 0; i < 55; i++) pts.push([rnd() * 1366, rnd() * 760]);
    pts.forEach(function (p, i) {
      pts.forEach(function (q, j) {
        if (j <= i) return;
        var d = Math.hypot(p[0] - q[0], p[1] - q[1]);
        if (d < 190) {
          var l = document.createElementNS(ns, "line");
          l.setAttribute("x1", p[0]); l.setAttribute("y1", p[1]);
          l.setAttribute("x2", q[0]); l.setAttribute("y2", q[1]);
          g.appendChild(l);
        }
      });
      var c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", p[0]); c.setAttribute("cy", p[1]); c.setAttribute("r", 2.5);
      g.appendChild(c);
    });
  })();
</script>
